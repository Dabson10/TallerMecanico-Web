<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./src/assets/car-mechanic.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PitCrew - Cliente Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./src/style.css">
</head>

<body class="bg-(--color-secClaro) text-text antialiased font-quarion">
    <div class="flex flex-col md:flex-row min-h-screen">
        <nav
            class="bg-(--color-cardClara) shadow-[0_-4px_20px_rgba(0,0,0,0.05)] md:shadow-none md:w-64 md:flex-shrink-0 md:h-screen sticky md:top-0 bottom-0 z-50 fixed md:relative w-full border-t md:border-t-0 md:border-r border-(--color-accent)/30 order-last md:order-first transition-colors">
            <div
                class="flex md:flex-col justify-around md:justify-start items-center md:items-stretch h-20 md:h-full px-2 py-3 md:p-6 gap-1 md:gap-2">

                <div class="hidden md:flex items-center gap-2 mb-8 px-2">
                    <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4">
                        </path>
                    </svg>
                    <span class="font-bold text-2xl text-primary tracking-tight">PitCrew</span>
                </div>

                <a href="#" id="nav-vehicle"
                    class="flex flex-col md:flex-row items-center justify-center gap-1 md:gap-3 px-3 py-2 md:px-4 md:py-3 text-primary font-medium rounded-2xl md:bg-accent/20 transition-colors md:justify-start w-[80px] md:w-auto h-[60px] md:h-auto">
                    <svg class="w-6 h-6 md:w-5 md:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    <span
                        class="text-[10px] md:text-sm uppercase md:capitalize tracking-wider md:tracking-normal font-bold md:font-semibold text-center md:text-left leading-tight line-clamp-1">Vehículo</span>
                </a>

                <a href="#" id="nav-orders"
                    class="flex flex-col md:flex-row items-center justify-center gap-1 md:gap-3 px-3 py-2 md:px-4 md:py-3 text-text/70 hover:bg-primary/10 font-medium rounded-2xl transition-colors md:justify-start w-[80px] md:w-auto h-[60px] md:h-auto">
                    <svg class="w-6 h-6 md:w-5 md:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                        </path>
                    </svg>
                    <span
                        class="text-[10px] md:text-sm uppercase md:capitalize tracking-wider md:tracking-normal font-bold md:font-semibold text-center md:text-left leading-tight line-clamp-1">Órdenes</span>
                </a>

                <a href="#" id="nav-profile"
                    class="flex flex-col md:flex-row items-center justify-center gap-1 md:gap-3 px-3 py-2 md:px-4 md:py-3 text-text/70 hover:bg-primary/10 font-medium rounded-2xl transition-colors md:justify-start w-[80px] md:w-auto h-[60px] md:h-auto">
                    <svg class="w-6 h-6 md:w-5 md:h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span
                        class="text-[10px] md:text-sm uppercase md:capitalize tracking-wider md:tracking-normal font-bold md:font-semibold text-center md:text-left leading-tight line-clamp-1">Perfil</span>
                </a>

                <!-- Divisor invisible para empujar el botón en desktop -->
                <div class="hidden md:block mt-auto"></div>

                <!-- Botón de Tema (Sol / Luna) -->
                <div class="p-2 z-10 relative cursor-pointer flex items-center justify-center hover:bg-accent/10 rounded-full transition-colors md:mt-auto md:w-12 md:h-12 w-10 h-10"
                    id="btn-tema">
                    <svg class="w-6 h-6 stroke-text" id="svg-luna" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
                    </svg>
                    <svg class="w-6 h-6 stroke-text hidden" id="svg-sol" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
                    </svg>
                </div>

            </div>
        </nav>

        <main class="relative flex-1 p-5 md:p-10 pb-24 md:pb-10 w-full max-w-7xl mx-auto relative">

            <!-- VISTA 1: VEHÍCULO -->
            <div id="view-vehicle" class="view-section fade-in">
                <header class="flex justify-between items-center mb-8">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-(--color-text)">Hola, <span
                                id="usuario" data-usuario="nombre"></span></h1>
                        <p class="text-(--color-text)/70 text-sm md:text-base mt-1 font-medium">Aquí está el
                            resumen de
                            tu vehículo.</p>
                    </div>
                    <div id="icon"
                        class="w-12 h-12 bg-(--color-accent)/30 rounded-full flex items-center justify-center text-(--color-cardAzul) font-bold text-xl shadow-sm border border-(--color-accent)">
                    </div>
                </header>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div
                        class="md:col-span-8 bg-(--color-secOscura) rounded-3xl p-6 md:p-8 text-(--color-textl) relative overflow-hidden shadow-2xl">
                        <!-- Sección para mostrar la tarjeta. -->
                        <div class="relative z-10" id="cardAuto">
                        </div>
                        <div
                            class="absolute -right-16 -bottom-16 opacity-60 w-80 h-80 bg-gradient-to-br from-accent to-transparent rounded-full blur-3xl pointer-events-none">
                        </div>
                        <svg class="absolute top-0 right-0 opacity-10 w-64 h-64 -translate-y-10 translate-x-10 pointer-events-none text-(--color-textl)"
                            fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- VISTA 2: ÓRDENES -->
            <div id="view-orders" class="view-section hidden fade-in">
                <header class="flex justify-between items-center mb-8">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-(--color-text)">Historial Reciente
                        </h1>
                        <p class="text-(--color-text)/70 text-sm md:text-base mt-1 font-medium">Revisa las reparaciones
                            y mantenimientos previos.</p>
                    </div>
                </header>

                <div id="ordenes" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">



                </div>
            </div>

            <!-- VISTA 3: PERFIL -->
            <div id="view-profile" class="view-section hidden fade-in">
                <header class="flex justify-between items-center mb-8">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-(--color-text)">Tu Perfil</h1>
                        <p class="text-(--color-text)/70 text-sm md:text-base mt-1 font-medium">Gestiona tu información
                            y métodos de contacto.</p>
                    </div>
                </header>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
                    <div
                        class="md:col-span-4 bg-(--color-cardClara) rounded-3xl p-8 shadow-sm flex flex-col items-center text-center border border-(--color-cardClara)">
                        <div id="icon"
                            class="w-24 h-24 bg-(--color-accent)/30 rounded-full flex items-center justify-center text-(--color-cardAzul) font-bold text-4xl mb-4 border-4 border-(--color-accent)/20">

                        </div>
                        <h2 class="text-2xl font-bold text-(--color-text) mb-1" id="usuario" data-usuario="nombre"></h2>
                        <!-- <p class="text-(--color-text)/60 text-sm font-medium mb-6">Cliente Diamante</p> -->

                        <div class="w-full bg-(--color-secClaro) rounded-2xl p-4 text-left mb-6">
                            <div class="mb-3">
                                <p class="text-[10px] text-(--color-text)/50 font-bold uppercase tracking-widest">
                                    Teléfono</p>
                                <p class="text-sm font-semibold text-(--color-text)" id="usuario"
                                    data-usuario="telefono">+52 55 1234 5678</p>
                            </div>
                            <div>
                                <p class="text-[10px] text-(--color-text)/50 font-bold uppercase tracking-widest">Email
                                </p>
                                <p class="text-sm font-semibold text-(--color-text)" id="usuario" data-usuario="correo">
                                    tadeo@correo.com</p>
                            </div>
                        </div>

                        <button
                            class="w-full mb-3 bg-(--color-accent)/20 hover:bg-(--color-accent)/40 text-(--color-secAzul) font-bold py-3 rounded-xl transition-colors">
                            Editar Perfil
                        </button>
                        <button
                            class="w-full bg-(--color-cardClara) border border-(--color-accent)/30 hover:bg-red-100 hover:text-red-800 hover:border-transparent text-(--color-text)/60 font-bold py-3 rounded-xl transition-colors">
                            Cerrar Sesión
                        </button>
                    </div>

                    <div class="md:col-span-8 flex flex-col gap-6">
                        <div class="bg-(--color-cardClara) rounded-3xl p-6 shadow-sm border border-(--color-cardClara)">
                            <h3 class="font-bold text-xl mb-4 text-text border-b border-(--color-accent)/20 pb-4">
                                Tus Vehículos Registrados</h3>
                            <!-- Contenedor con diferentes  -->
                            <div id="contAutoN" class="felx flex-col">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Alertas para formulario de cambio de datos y mostrar detalles-->
        </main>
    </div>


    <!-- Archivo principal de Vite -->
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="./src/js/cliente.js" defer></script>
</body>

</html>
