<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="./src/assets/car-mechanic.svg">
</head>

<body class="p-0 m-0 box-border w-screen h-screen font-quarion ">
    <!-- Contendra el login y la imagen -->
    <section class="w-screen h-screen relative overflow-hidden">
        <!-- Los estilos en lg son para separar los dos contenedores. -->
        <!-- Imagen de la pantalla -->
        <div class="absolute inset-0 -z-10">
            <img class="w-full h-full object-cover object-center brightness-150" src="./src/assets/ocean.jpg" alt="">
        </div>
        <!-- Login -->
        <div class="flex flex-col items-center justify-center w-full h-full px-5">
            <!-- Card del login o registro. -->
            <!-- login -->
            <form data-form="iniciar" class="formulario ocultar" id="formLog" action="">

                <h4 class="text-3xl font-bold tracking-tight mb-2">
                    Iniciar sesión
                </h4>
                <p class="text-sm mb-6">
                    Bienvenido de vuelta al Crew.
                </p>

                <label class="text-sm font-bold uppercase tracking-wider  mb-2" for="email">
                    Correo electrónico
                </label>
                <input id="email"
                    class="border border-white/20 bg-white/5 rounded-xl p-3 mb-5 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary">


                <label class=" text-sm font-bold uppercase tracking-wider mb-2" for="">Contraseña</label>
                <div
                    class="border border-white/40 bg-white/5 rounded-xl p-3 mb-8 flex items-center focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
                    <input id="password" class="w-full bg-transparent focus:outline-none " type="password"
                        placeholder="••••••••" required>
                </div>

                <button type="button" id="btn-logIn"
                    class="w-full bg-primary  font-bold uppercase tracking-widest p-4 rounded-4xl shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all cursor-pointer text-center">
                    Ingresar al taller
                </button>
                <p class="text-center  mt-2">Si aun no tienes cuenta puedes crearla aqui.
                    <span id="btncambio" data-formu="iniciar" class="text-primary cursor-pointer">Crear
                        Cuenta</span>
                </p>
            </form>
            <!-- SigIn -->
            <form data-form="crear" class="formulario " id="formLog" action="">

                <h4 class="text-3xl font-bold tracking-tight mb-1">
                    Crear cuenta
                </h4>
                <p class="text-sm mb-6 text-white/70">
                    Bienvenido al Crew.
                </p>

                <!-- Nombre y Apellido -->
                <div class="flex flex-row gap-4 mb-4 w-full">

                    <div class="flex-1 flex flex-col">
                        <label class="text-xs font-bold uppercase tracking-wider mb-2" for="userName">
                            Nombre
                        </label>
                        <input type="text" id="userName" placeholder="Nombre" required
                            class="border border-white/20 bg-white/5 rounded-xl p-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-full text-sm">
                    </div>

                    <div class="flex-1 flex flex-col">
                        <label class="text-xs font-bold uppercase tracking-wider mb-2" for="userLastName">
                            Apellido
                        </label>
                        <input type="text" id="userLastName" placeholder="Apellido" required
                            class="border border-white/20 bg-white/5 rounded-xl p-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-full text-sm">
                    </div>

                </div>

                <!-- Correo electrónico -->
                <label class="text-xs font-bold uppercase tracking-wider mb-2" for="userEmail">
                    Correo electrónico
                </label>
                <input type="email" id="userEmail" placeholder="example@gmail.com" required
                    class="border border-white/20 bg-white/5 rounded-xl p-3 mb-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-sm">

                <!-- Contraseña -->
                <label class="text-xs font-bold uppercase tracking-wider mb-2" for="password">
                    Contraseña
                </label>
                <div
                    class="border border-white/40 bg-white/5 rounded-xl p-3 mb-6 flex items-center focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
                    <input type="password" id="password" placeholder="••••••••" required
                        class="w-full bg-transparent focus:outline-none text-sm">
                </div>

                <!-- Botón de acción -->
                <button type="button" id="btn-logIn"
                    class="w-full bg-primary font-bold uppercase tracking-widest p-4 rounded-4xl shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all cursor-pointer text-center text-sm">
                    Crear cuenta.
                </button>

                <!-- Link inferior -->
                <p class="text-center  mt-4 text-white/80">
                    Si ya tienes una cuenta ingresala aqui.
                    <span id="btncambio" data-formu="crear"
                        class="text-primary cursor-pointer font-semibold block sm:inline mt-1 sm:mt-0 hover:underline">
                        Iniciar sesión
                    </span>
                </p>
            </form>
        </div>
    </section>
    <script type="module" src="/src/js/login.js"></script>
</body>

</html>
