<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- <link rel="stylesheet" href="./src/style.css"> -->
  <title>PitCrew</title>
</head>

<body class="bg-fondo p-0 m-0 w-screen h-screen flex flex-col font-quarion overflow-x-hidden">

  <!-- En circulo -->
  <header class=" w-full font-quarion sticky  flex items-center justify-center gap-1 p-2 mt-2">
    <!-- Contenedor que envuelve al las opciones principales. -->
    <div class="flex justify-center  items-center gap-3">
      <!-- Contenedor 1 -->
      <div class=" border-2 border-r-0 relative flex items-center flex-row ">
        <p class="py-2 px-2 pr-6">Nosotros</p>
        <div
          class="absolute -translate-y-1/2 -translate-x-1/2 -bottom-full right-[-79%] border-2 border-y-transparent border-r-transparent rounded-4xl w-[60px] h-[60px]">
        </div>
      </div>
      <!-- Icono -->
      <div class="border-text p-2 z-10 relative ">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-7 ">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008Z" />
        </svg>
        <div class="absolute -translate-y-1/2 -translate-x-1/2 top-1/2 left-1/2 border-2 rounded-4xl w-15 h-15"></div>
      </div>
      <!-- Otro boton -->
      <div class="border-2 border-l-0 relative flex items-center flex-row ">
        <p class="py-2 px-2 pl-6">Busqueda</p>
        <div
          class="absolute -translate-y-1/2 -translate-x-1/2 top-1/2 left-[-19%] border-2 border-y-transparent border-l-transparent rounded-4xl w-[60px] h-[60px]">
        </div>
      </div>
    </div>
  </header>

  <section class="relative w-full h-full flex">
    <!-- Contenedor con la  -->
    <div class="absolute top-1/12 left-1/12 flex flex-col items-center z-9 rotate-25">
      <h1 class="font-estrella text-9xl">PitCrew</h1>
      <p class="text-xl">Enchulamos tu vehiculo</p>
    </div>
    <div class="w-142 h-70 absolute top-1/3 left-1 -ml-63 z-1">
      <img class="object-cover w-full h-full" src="./src/assets/hd_restoration_result_image.png" alt="">
    </div>
  </section>


  <footer class="mt-auto">
    Este es el pie de pagina.
  </footer>



  <script type="module" src="/src/main.js"></script>

</html>
