<!doctype html>
<html lang="es" class="overflow-x-hidden">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- <link rel="stylesheet" href="./src/style.css"> -->
  <title>PitCrew</title>
</head>

<body class="bg-fondo p-0 m-0 w-screen h-screen flex flex-col font-quarion overflow-x-hidden">

  <!-- En circulo -->
  <header class=" w-full font-quarion sticky flex items-center justify-center gap-1 p-2 mt-2">
    <!-- Contenedor que envuelve al las opciones principales. -->
    <!-- Si se decide cambiar el valor de p entonces deberas ajustar el div en continuacion ajustando
      ya sea el right o left ya sea el caso -->
    <div class="flex justify-center items-center gap-3">
      <!-- Contenedor 1 -->
      <div class="relative  flex items-center justify-center flex-row ">
        <p class="py-2 px-2 pr-6
        text-2xl
        ">Cliente</p>
        <div
          class="absolute -translate-y-1/2 -translate-x-1/2 bottom-[-92%] right-[-76%] border-dotted border-2 border-y-transparent border-r-transparent rounded-4xl w-[67px] h-[67px]">
        </div>
      </div>
      <!-- Icono -->
      <div class=" p-2 z-10 relative">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          class="size-7 ">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008Z" />
        </svg>
        <div
          class="absolute -translate-y-1/2 -translate-x-1/2 top-1/2 left-1/2 border-dashed border-2 rounded-4xl w-[60px] h-[60px]">
        </div>
      </div>
      <!-- Otro boton -->
      <div class="relative flex items-center flex-row ">
        <p class="py-2 px-2 pl-6 text-2xl">Mecanico</p>
        <div
          class="absolute -translate-y-1/2 -translate-x-1/2 top-1/2 left-[-14%] border-dotted border-2 border-y-transparent border-l-transparent rounded-4xl w-[65px] h-[65px]">
        </div>
      </div>
    </div>
  </header>

  <!-- Cuerpo de la pagina. -->
  <section class="w-full flex-1 flex relative">
    <!-- Vista inicial de la pagina. -->
    <section class="w-full flex-1 flex">
      <!-- Contenedor del svg -->
      <div class="absolute top-[28%] left-1/2 -translate-1/2 flex flex-col items-center -z-1
      min-[575px]:top-[27%] 
      sm:top-[23%] 
      md:top-[27%] md:left-[60%]
      lg:top-[28%] lg:left-[75%]
      xl:top-[30%] xl:left-[67%] ">
        <svg viewBox="0 0 500 350" class=" relative h-auto
        w-sm
        sm:w-xs
        md:w-lg
        xl:w-md
        ">
          <!-- Tema o titulo -->
          <path id="riel-titulo" d="M 50,120 C 45,200 430,140 470,260" fill="none" stroke="none" />
          <!-- subtema  -->
          <path id="riel-subtema" d="M 10,180 C 5,230 400,200 470,330" fill="none" stroke="none" stroke-width="2" />
          <text class="font-estrella fill-text tracking-wide font-normal
          text-9xl
          sm:text-[160px]
          md:text-[185px]
          lg:text-[140px]
          xl:text-[180px]
          ">
            <textPath href="#riel-titulo" startOffset="5%">
              PitCrew
            </textPath>
          </text>

          <text class="font-quarion fill-text tracking-widest uppercase
          text-2xl">
            <textPath href=" #riel-subtema" startOffset="6%">
              Enchulamos tu vehiculo
            </textPath>
          </text>
        </svg>
      </div>

      <div class="w-full h-[280px] relative ">
        <div class="w-[720px] h-auto absolute top-[58%] -right-1/4 
        min-[300px]:top-[87%] min-[300px]:left-[-65%] 
        min-[410px]:right-[-20%] min-[400px]:top-[90%] 
        min-[575px]:right-[-10%] 
        sm:right-[0%] sm:w-[900px] sm:top-[55%] 
        md:top-full  md:left-[-40%]
        lg:w-[1000px] lg:left-[-4%] lg:top-[50%]
        xl:right-[0%] xl:w-[1100px]">
          <img class="object-contain w-full h-full drop-shadow-xl/1000 "
            src="./src/assets/hd_restoration_result_image.png" alt="Vehiculo verde">
        </div>
      </div>
    </section>
  </section>



  <footer class="mt-auto border-t-2">
    Este es el pie de pagina.
  </footer>



  <script type="module" src="/src/main.js"></script>
</body>

</html>
